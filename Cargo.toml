[package]
name = "helios"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A Sun SPARC workstation emulator, starting with SPARCstation 5"
publish = false

[features]
default = []
perf-counters = []
chd = ["dep:libchdman-rs"]
host-icmp = ["dep:socket2"]

[dependencies]
libchdman-rs = { version = "=0.289.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "=0.6.5", optional = true }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

