[package]
name = "helios-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
publish = false

# Keep desktop dependencies separate from the dependency-free headless build.
[workspace]

[dependencies]
helios = { path = ".." }
minifb = { version = "=0.27.0", default-features = false, features = ["x11"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
